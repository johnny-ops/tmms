services:
  - type: web
    name: tmms-ai-service
    runtime: python
    rootDir: tmms/apps/ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: YOLO_DEVICE
        value: cpu
      - key: YOLO_MODEL_PATH
        value: ./yolov8n.pt
      - key: YOLO_CONFIDENCE
        value: 0.35
